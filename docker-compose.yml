services:
  chat:
    image: ghcr.io/tokendancelab/tokendance-chat:latest
    build: .
    container_name: tokendancechat
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CHAT_ADDR: ${CHAT_ADDR:-:8080}
      CHAT_DB_PATH: ${CHAT_DB_PATH:-/app/data/chat.db}
      CHAT_FRONTEND_DIR: ${CHAT_FRONTEND_DIR:-/app/frontend/dist}
      # Required for compose deployments. Generate a stable random value in .env.
      CHAT_SESSION_SECRET: ${CHAT_SESSION_SECRET:?Set CHAT_SESSION_SECRET in .env before running docker compose}
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-}
      CHAT_TRUSTED_PROXY_CIDRS: ${CHAT_TRUSTED_PROXY_CIDRS:-}
      CHAT_OIDC_ENABLED: ${CHAT_OIDC_ENABLED:-false}
      CHAT_OIDC_ISSUER: ${CHAT_OIDC_ISSUER:-}
      CHAT_OIDC_CLIENT_ID: ${CHAT_OIDC_CLIENT_ID:-}
      CHAT_OIDC_REDIRECT_URI: ${CHAT_OIDC_REDIRECT_URI:-http://localhost:8080/api/oidc/callback}
      CHAT_MEDIA_S3_ENDPOINT: ${CHAT_MEDIA_S3_ENDPOINT:-}
      CHAT_MEDIA_S3_REGION: ${CHAT_MEDIA_S3_REGION:-}
      CHAT_MEDIA_S3_BUCKET: ${CHAT_MEDIA_S3_BUCKET:-}
      CHAT_MEDIA_S3_ACCESS_KEY_ID: ${CHAT_MEDIA_S3_ACCESS_KEY_ID:-}
      CHAT_MEDIA_S3_SECRET_ACCESS_KEY: ${CHAT_MEDIA_S3_SECRET_ACCESS_KEY:-}
      CHAT_MEDIA_S3_SESSION_TOKEN: ${CHAT_MEDIA_S3_SESSION_TOKEN:-}
      CHAT_MEDIA_S3_PREFIX: ${CHAT_MEDIA_S3_PREFIX:-}
      CHAT_MEDIA_S3_FORCE_PATH_STYLE: ${CHAT_MEDIA_S3_FORCE_PATH_STYLE:-false}
      CHAT_MEDIA_WEBDAV_ENDPOINT: ${CHAT_MEDIA_WEBDAV_ENDPOINT:-}
      CHAT_MEDIA_WEBDAV_USER: ${CHAT_MEDIA_WEBDAV_USER:-}
      CHAT_MEDIA_WEBDAV_PASS: ${CHAT_MEDIA_WEBDAV_PASS:-}
