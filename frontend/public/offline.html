<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://chat.tokendancelab.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline - TokenDanceChat</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #f5f5f7;
        color: #13111c;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      .card {
        width: min(100%, 22rem);
        padding: 1.25rem;
        text-align: center;
        border: 1px solid rgba(19, 17, 28, 0.08);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 16px 48px rgba(19, 17, 28, 0.08);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: rgba(0, 113, 188, 0.08);
        color: #0071bc;
      }
      .icon svg { width: 28px; height: 28px; stroke: currentColor; fill: none; }
      h1 { margin-bottom: 0.5rem; font-size: 1.25rem; line-height: 1.25; font-weight: 650; }
      p { margin-bottom: 0.75rem; color: #5f6270; font-size: 1rem; line-height: 1.55; }
      .en { color: #7a7d89; font-size: 0.9375rem; }
      button {
        min-height: 44px;
        margin-top: 0.5rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 10px;
        background: #0071bc;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #005f9f; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h1>当前离线</h1>
      <p>请检查网络连接，然后重试。</p>
      <p class="en">You are offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">重试 / Retry</button>
    </main>
  </body>
</html>
